[project]
name = "liveops-vision"
version = "0.1.0"
description = "LiveOps events from mobile game screenshots with VLMs, measured"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
]
